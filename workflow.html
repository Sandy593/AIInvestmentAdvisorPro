<!DOCTYPE html>
<html>
<head>
    <title>14-Agent Workflow Visualization</title>
</head>
<body>
    <svg width="1400" height="1000" xmlns="http://www.w3.org/2000/svg">
        <!-- Define gradients and styles -->
        <defs>
            <!-- Gradient definitions for different agent types -->
            <linearGradient id="routerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
            </linearGradient>
            <linearGradient id="discoveryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#4c5fd7;stop-opacity:1" />
            </linearGradient>
            <linearGradient id="analysisGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" style="stop-color:#764ba2;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#5f3b8a;stop-opacity:1" />
            </linearGradient>
            <linearGradient id="validationGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" style="stop-color:#22c55e;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#16a34a;stop-opacity:1" />
            </linearGradient>
            <linearGradient id="emergingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#d97706;stop-opacity:1" />
            </linearGradient>
            <linearGradient id="outputGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" style="stop-color:#ef4444;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#dc2626;stop-opacity:1" />
            </linearGradient>
            
            <!-- Arrow markers -->
            <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
                <polygon points="0 0, 10 3.5, 0 7" fill="#666" />
            </marker>
            <marker id="arrowheadDashed" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
                <polygon points="0 0, 10 3.5, 0 7" fill="#999" />
            </marker>
        </defs>
        
        <!-- Background -->
        <rect width="1400" height="1000" fill="#f8f9fa"/>
        
        <!-- Title -->
        <text x="700" y="30" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#1a1a2e">
            14-Agent Investment Advisor Workflow
        </text>
        
        <!-- Start Node -->
        <ellipse cx="700" cy="80" rx="80" ry="30" fill="#e0e6ed" stroke="#666" stroke-width="2"/>
        <text x="700" y="85" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">User Request</text>
        
        <!-- 1. Discovery Router -->
        <rect x="600" y="130" width="200" height="60" rx="10" fill="url(#routerGrad)" stroke="#7c3aed" stroke-width="3"/>
        <text x="700" y="155" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="white">🔍 Discovery Router</text>
        <text x="700" y="175" font-family="Arial" font-size="12" text-anchor="middle" fill="white">Master Coordinator</text>
        
        <!-- Arrow from Start to Router -->
        <line x1="700" y1="110" x2="700" y2="130" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
        
        <!-- 2-4. Discovery Agents (3 parallel) -->
        <!-- Sector Stock Specialist -->
        <rect x="200" y="240" width="180" height="60" rx="10" fill="url(#discoveryGrad)" stroke="#4c5fd7" stroke-width="2"/>
        <text x="290" y="265" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="white">📈 Sector Specialist</text>
        <text x="290" y="285" font-family="Arial" font-size="11" text-anchor="middle" fill="white">8-12 stocks/sector</text>
        
        <!-- Crypto Discovery -->
        <rect x="510" y="240" width="180" height="60" rx="10" fill="url(#discoveryGrad)" stroke="#4c5fd7" stroke-width="2"/>
        <text x="600" y="265" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="white">₿ Crypto Discovery</text>
        <text x="600" y="285" font-family="Arial" font-size="11" text-anchor="middle" fill="white">10-12 cryptos</text>
        
        <!-- ETF Strategy -->
        <rect x="820" y="240" width="180" height="60" rx="10" fill="url(#discoveryGrad)" stroke="#4c5fd7" stroke-width="2"/>
        <text x="910" y="265" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="white">📊 ETF Strategy</text>
        <text x="910" y="285" font-family="Arial" font-size="11" text-anchor="middle" fill="white">10-12 ETFs</text>
        
        <!-- Arrows from Router to Discovery Agents -->
        <line x1="650" y1="190" x2="350" y2="240" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
        <text x="450" y="210" font-family="Arial" font-size="11" fill="#666">Stocks</text>
        
        <line x1="700" y1="190" x2="600" y2="240" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
        <text x="650" y="210" font-family="Arial" font-size="11" fill="#666">Cryptos</text>
        
        <line x1="750" y1="190" x2="850" y2="240" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
        <text x="800" y="210" font-family="Arial" font-size="11" fill="#666">ETFs</text>
        
        <!-- 5-6. Analysis Agents (Parallel for Stocks) -->
        <!-- Company Intelligence -->
        <rect x="50" y="350" width="180" height="60" rx="10" fill="url(#analysisGrad)" stroke="#5f3b8a" stroke-width="2"/>
        <text x="140" y="375" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="white">🏢 Company Intel</text>
        <text x="140" y="395" font-family="Arial" font-size="11" text-anchor="middle" fill="white">Deep analysis</text>
        
        <!-- Market Sentiment -->
        <rect x="250" y="350" width="180" height="60" rx="10" fill="url(#analysisGrad)" stroke="#5f3b8a" stroke-width="2"/>
        <text x="340" y="375" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="white">😊 Sentiment</text>
        <text x="340" y="395" font-family="Arial" font-size="11" text-anchor="middle" fill="white">Score: -5 to +5</text>
        
        <!-- Dashed arrows for parallel execution -->
        <line x1="250" y1="300" x2="140" y2="350" stroke="#999" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowheadDashed)"/>
        <line x1="330" y1="300" x2="340" y2="350" stroke="#999" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowheadDashed)"/>
        
        <!-- 7. Market Data Validation (Convergence Point) -->
        <rect x="450" y="460" width="200" height="60" rx="10" fill="url(#validationGrad)" stroke="#16a34a" stroke-width="2"/>
        <text x="550" y="485" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="white">📊 Market Validation</text>
        <text x="550" y="505" font-family="Arial" font-size="11" text-anchor="middle" fill="white">Real-time prices</text>
        
        <!-- Arrows to Market Validation -->
        <line x1="140" y1="410" x2="470" y2="460" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
        <line x1="340" y1="410" x2="490" y2="460" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
        <line x1="600" y1="300" x2="550" y2="460" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
        <line x1="910" y1="300" x2="630" y2="460" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
        
        <!-- 8. Emerging Opportunities Hunter -->
        <rect x="450" y="560" width="200" height="60" rx="10" fill="url(#validationGrad)" stroke="#16a34a" stroke-width="2"/>
        <text x="550" y="585" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="white">💎 Opportunity Hunter</text>
        <text x="550" y="605" font-family="Arial" font-size="11" text-anchor="middle" fill="white">Exclude known symbols</text>
        
        <!-- Arrow from Validation to Hunter -->
        <line x1="550" y1="520" x2="550" y2="560" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
        
        <!-- 9-11. Emerging Opportunity Agents (3 parallel) -->
        <!-- Penny Stock Hunter -->
        <rect x="200" y="670" width="180" height="60" rx="10" fill="url(#emergingGrad)" stroke="#d97706" stroke-width="2"/>
        <text x="290" y="695" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="white">💰 Penny Stocks</text>
        <text x="290" y="715" font-family="Arial" font-size="11" text-anchor="middle" fill="white">Under $5</text>
        
        <!-- Moonshot Crypto -->
        <rect x="460" y="670" width="180" height="60" rx="10" fill="url(#emergingGrad)" stroke="#d97706" stroke-width="2"/>
        <text x="550" y="695" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="white">🚀 Moonshot Crypto</text>
        <text x="550" y="715" font-family="Arial" font-size="11" text-anchor="middle" fill="white">Under $1</text>
        
        <!-- Innovative ETF Scout -->
        <rect x="720" y="670" width="180" height="60" rx="10" fill="url(#emergingGrad)" stroke="#d97706" stroke-width="2"/>
        <text x="810" y="695" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="white">🔬 Innovative ETFs</text>
        <text x="810" y="715" font-family="Arial" font-size="11" text-anchor="middle" fill="white">New strategies</text>
        
        <!-- Arrows from Hunter to Emerging Agents -->
        <line x1="500" y1="620" x2="350" y2="670" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
        <line x1="550" y1="620" x2="550" y2="670" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
        <line x1="600" y1="620" x2="750" y2="670" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
        
        <!-- 12. Report Generation -->
        <rect x="450" y="780" width="200" height="60" rx="10" fill="url(#outputGrad)" stroke="#dc2626" stroke-width="2"/>
        <text x="550" y="805" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="white">📝 Report Generation</text>
        <text x="550" y="825" font-family="Arial" font-size="11" text-anchor="middle" fill="white">Synthesize findings</text>
        
        <!-- Arrows to Report Generation -->
        <line x1="350" y1="730" x2="470" y2="780" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
        <line x1="550" y1="730" x2="550" y2="780" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
        <line x1="750" y1="730" x2="630" y2="780" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
        
        <!-- 13-14. Final Agents (Parallel) -->
        <!-- Database Persistence -->
        <rect x="300" y="890" width="180" height="60" rx="10" fill="url(#outputGrad)" stroke="#dc2626" stroke-width="2"/>
        <text x="390" y="915" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="white">💾 Database</text>
        <text x="390" y="935" font-family="Arial" font-size="11" text-anchor="middle" fill="white">SQLite storage</text>
        
        <!-- Communication -->
        <rect x="620" y="890" width="180" height="60" rx="10" fill="url(#outputGrad)" stroke="#dc2626" stroke-width="2"/>
        <text x="710" y="915" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="white">📧 Communication</text>
        <text x="710" y="935" font-family="Arial" font-size="11" text-anchor="middle" fill="white">Email reports</text>
        
        <!-- Dashed arrows for parallel execution -->
        <line x1="500" y1="840" x2="420" y2="890" stroke="#999" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowheadDashed)"/>
        <line x1="600" y1="840" x2="680" y2="890" stroke="#999" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowheadDashed)"/>
        
        <!-- End Node -->
        <ellipse cx="550" cy="980" rx="60" ry="25" fill="#e0e6ed" stroke="#666" stroke-width="2"/>
        <text x="550" y="985" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">Complete</text>
        
        <!-- Arrows to End -->
        <line x1="430" y1="950" x2="500" y2="970" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
        <line x1="670" y1="950" x2="600" y2="970" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
        
        <!-- Legend -->
        <g transform="translate(1050, 300)">
            <text x="0" y="-10" font-family="Arial" font-size="16" font-weight="bold" fill="#333">Legend</text>
            
            <rect x="0" y="10" width="120" height="25" rx="5" fill="url(#routerGrad)"/>
            <text x="130" y="27" font-family="Arial" font-size="12" fill="#333">Router</text>
            
            <rect x="0" y="45" width="120" height="25" rx="5" fill="url(#discoveryGrad)"/>
            <text x="130" y="62" font-family="Arial" font-size="12" fill="#333">Discovery Agents</text>
            
            <rect x="0" y="80" width="120" height="25" rx="5" fill="url(#analysisGrad)"/>
            <text x="130" y="97" font-family="Arial" font-size="12" fill="#333">Analysis Agents</text>
            
            <rect x="0" y="115" width="120" height="25" rx="5" fill="url(#validationGrad)"/>
            <text x="130" y="132" font-family="Arial" font-size="12" fill="#333">Validation Agents</text>
            
            <rect x="0" y="150" width="120" height="25" rx="5" fill="url(#emergingGrad)"/>
            <text x="130" y="167" font-family="Arial" font-size="12" fill="#333">Emerging Agents</text>
            
            <rect x="0" y="185" width="120" height="25" rx="5" fill="url(#outputGrad)"/>
            <text x="130" y="202" font-family="Arial" font-size="12" fill="#333">Output Agents</text>
            
            <line x1="0" y1="230" x2="50" y2="230" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
            <text x="55" y="235" font-family="Arial" font-size="12" fill="#333">Sequential</text>
            
            <line x1="0" y1="250" x2="50" y2="250" stroke="#999" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowheadDashed)"/>
            <text x="55" y="255" font-family="Arial" font-size="12" fill="#333">Parallel</text>
        </g>
        
        <!-- Agent Count Box -->
        <g transform="translate(1050, 100)">
            <rect x="0" y="0" width="250" height="150" rx="10" fill="#f0f4f8" stroke="#667eea" stroke-width="2"/>
            <text x="125" y="30" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">14 Agents Total</text>
            <text x="10" y="60" font-family="Arial" font-size="12" fill="#555">• 1 Router/Orchestrator</text>
            <text x="10" y="80" font-family="Arial" font-size="12" fill="#555">• 3 Discovery Agents</text>
            <text x="10" y="100" font-family="Arial" font-size="12" fill="#555">• 2 Analysis Agents</text>
            <text x="10" y="120" font-family="Arial" font-size="12" fill="#555">• 2 Validation Agents</text>
            <text x="10" y="140" font-family="Arial" font-size="12" fill="#555">• 3 Emerging Agents</text>
            <text x="10" y="160" font-family="Arial" font-size="12" fill="#555">• 3 Output Agents</text>
        </g>
    </svg>
</body>
</html>
